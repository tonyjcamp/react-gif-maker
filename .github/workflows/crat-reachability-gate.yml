name: CrAT Reachability Gate

# Manually triggered for now (testcase). To gate real PRs later, add a
# `pull_request:` trigger and make this job a required status check in branch
# protection.
on:
  workflow_dispatch:
    inputs:
      severity_floor:
        description: "Block only on watchlist entries at or above this severity"
        type: choice
        default: HIGH
        options:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      dry_run:
        description: "Report findings but do not fail the run"
        type: boolean
        default: false

jobs:
  reachability-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo under test
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cdxgen (SBOM generator CrAT shells out to)
        run: npm install -g @cyclonedx/cdxgen

      - name: Fetch CrAT (private) and install its deps
        env:
          CRAT_REPO_TOKEN: ${{ secrets.CRAT_REPO_TOKEN }}
        run: |
          if [ -z "$CRAT_REPO_TOKEN" ]; then
            echo "::error::CRAT_REPO_TOKEN secret is not set. Add a fine-grained PAT with read access to manifest-cyber/CRAT."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${CRAT_REPO_TOKEN}@github.com/manifest-cyber/CRAT.git" \
            "$RUNNER_TEMP/crat"
          cd "$RUNNER_TEMP/crat"
          bun install

      - name: Generate package inventory
        run: |
          cd "$RUNNER_TEMP/crat"
          bun run crat -- generate "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/crat-packages.json"

      - name: Analyze reachability for watchlisted packages present in this repo
        run: |
          # Only ask CrAT about watchlist packages that actually exist here.
          # `reach` errors on an unknown package, and a package you don't
          # depend on can't be reachable anyway.
          NAMES=$(jq -rn \
            --slurpfile wl "$GITHUB_WORKSPACE/crat-watchlist.json" \
            --slurpfile pk "$GITHUB_WORKSPACE/crat-packages.json" '
              ($pk[0].packages | map(.name)) as $present
              | [ $wl[0].packages[].name | select(. as $n | $present | index($n)) ]
              | join(",")')
          echo "Watchlisted packages present in repo: ${NAMES:-<none>}"
          if [ -n "$NAMES" ]; then
            cd "$RUNNER_TEMP/crat"
            bun run crat -- reach "$GITHUB_WORKSPACE/crat-packages.json" \
              --package "$NAMES" \
              --output "$GITHUB_WORKSPACE/crat-reach.json"
          else
            echo "[]" > "$GITHUB_WORKSPACE/crat-reach.json"
          fi

      - name: Evaluate gate
        run: |
          node "$GITHUB_WORKSPACE/scripts/crat-gate.mjs" \
            --watchlist "$GITHUB_WORKSPACE/crat-watchlist.json" \
            --reach "$GITHUB_WORKSPACE/crat-reach.json" \
            --severity-floor "${{ inputs.severity_floor }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crat-analysis
          path: |
            crat-packages.json
            crat-reach.json
