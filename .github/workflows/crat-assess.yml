name: CrAT Assessment

# CrAT reachability GATE. Runs `manifest-cli crat` (install toolchain, generate +
# publish SBOM, scan, download VDR, run `crat assess` — LLM function-level
# reachability), then BLOCKS the PR when any REACHABLE vulnerability is at or
# above the severity floor (default HIGH). Make this job a required status check
# in branch protection to enforce the block.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      severity_floor:
        description: "Block on REACHABLE findings at or above this severity"
        type: choice
        default: HIGH
        options: [LOW, MEDIUM, HIGH, CRITICAL]
      dry_run:
        description: "Report findings but do not fail the run"
        type: boolean
        default: false
      llm_model:
        description: "LLM for assess (provider/model). Hyphenated Anthropic ids (claude-sonnet-4-5), not dotted."
        type: string
        default: anthropic/claude-sonnet-4-5

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cdxgen + manifest-cli + syft
        run: |
          npm install -g @cyclonedx/cdxgen
          curl -sSfL https://raw.githubusercontent.com/manifest-cyber/cli/main/install.sh | sh -s -- -b /usr/local/bin
          # manifest-cli crat needs the SBOM generator; --install-dependencies installs crat but not syft
          manifest-cli install --generator=syft --destination=/usr/local/bin

      - name: Run CrAT assessment
        env:
          MANIFEST_API_KEY: ${{ secrets.MANIFEST_API_KEY }}
          CRAT_LOGIC_KEY: ${{ secrets.CRAT_LOGIC_KEY }}
        run: |
          manifest-cli crat . \
            --install-dependencies \
            --api-key "$MANIFEST_API_KEY" \
            --llm "${{ inputs.llm_model || 'anthropic/claude-sonnet-4-5' }}" \
            --llm-api-key "$CRAT_LOGIC_KEY"

      - name: Summarize assessment
        run: |
          F=$(ls -t assessment-*.json assessment.json 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "::error::no assessment file produced"; exit 1; fi
          echo "Assessment file: $F"
          jq '{
            llm: .llmModel,
            totalComponents,
            vulnerableComponents,
            reachable: [.components[].assessments[]? | select(.reachabilityLabel=="REACHABLE")] | length,
            potential: [.components[].assessments[]? | select(.reachabilityLabel=="POTENTIALLY REACHABLE")] | length,
            unreachable: [.components[].assessments[]? | select(.reachabilityLabel=="UNREACHABLE FROM APPLICATION")] | length
          }' "$F"

      - name: Evaluate gate (block on reachable findings)
        run: |
          F=$(ls -t assessment-*.json assessment.json 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "::error::no assessment file produced"; exit 1; fi
          node "$GITHUB_WORKSPACE/scripts/crat-assess-gate.mjs" \
            --assessment "$F" \
            --severity-floor "${{ inputs.severity_floor || 'HIGH' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crat-assessment
          path: assessment*.json
